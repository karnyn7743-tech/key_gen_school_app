name: Build Activation Key Generator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_android.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: key-generator-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Show Tool Versions
        run: |
          flutter --version
          java -version

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Build Release APK
        shell: bash
        run: |
          cd android
          ./gradlew :app:assembleRelease
          cd ..
          mkdir -p build/app/outputs/flutter-apk
          APK="$(find android/app/build/outputs -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Gradle completed but no APK was found. Listing Android build outputs:"
            find android/app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          echo "APK copied from: $APK"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          file "$APK"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: key-generator-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
