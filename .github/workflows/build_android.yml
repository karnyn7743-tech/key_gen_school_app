name: Build Activation Key Generator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_android.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: key-generator-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      # Generate the wrapper in an isolated empty Gradle project. This avoids
      # configuring Flutter's included Gradle build before Flutter dependencies are ready.
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          WRAPPER_DIR="$RUNNER_TEMP/gradle-wrapper-project"
          mkdir -p "$WRAPPER_DIR"
          printf "tasks.register('wrapper', Wrapper)\n" > "$WRAPPER_DIR/build.gradle"
          cd "$WRAPPER_DIR"
          gradle wrapper --gradle-version 9.3.1 --distribution-type all
          cp gradlew "$GITHUB_WORKSPACE/android/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/android/gradlew.bat"
          mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/"
          cp gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/android/gradle/wrapper/"

      - name: Show Tool Versions
        run: |
          flutter --version
          java -version
          cd android && ./gradlew --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub

      - name: Build Release APK
        run: flutter build apk --release --verbose

      - name: Verify APK
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: key-generator-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
