name: Build Activation Key Generator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_android.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: key-generator-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Show Tool Versions
        run: |
          flutter --version
          java -version

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Decode and Validate Release Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keygen-upload-keystore.jks
          test -s android/app/keygen-upload-keystore.jks
          keytool -list -keystore android/app/keygen-upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Release keystore and alias validated."

      - name: Build Release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keygen-upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Release build attempt $attempt of 3"
            if flutter build apk --release --verbose; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 30 seconds before retry (transient dependency repository errors may recover)."
              sleep 30
            fi
          done
          echo "Release APK build failed after 3 attempts."
          exit 1

      - name: Locate and Verify APK and Signing Certificate
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p build/app/outputs/flutter-apk
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "Flutter did not produce the expected APK: $APK_PATH"
            find build -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$APKSIGNER" verify --verbose "$APK_PATH"

          EXPECTED_DIGEST="$(keytool -exportcert -keystore android/app/keygen-upload-keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sha256sum | awk '{print tolower($1)}')"
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1)"
          CERT_DIGEST="$(printf '%s\\n' "$CERT_OUTPUT" | grep -i 'certificate SHA-256 digest:' | head -n 1 | sed 's/.*digest: *//' | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          if [ -z "$CERT_DIGEST" ]; then
            echo "Could not extract APK signing certificate digest. Tool output follows:"
            printf '%s\\n' "$CERT_OUTPUT"
            exit 1
          fi
          if [ "$CERT_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "APK signing certificate does not match the configured keystore."
            echo "APK certificate SHA-256: $CERT_DIGEST"
            echo "Keystore certificate SHA-256: $EXPECTED_DIGEST"
            exit 1
          fi
          echo "APK signature and configured keystore certificate verified."
          file "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Remove Signing Keystore
        if: always()
        shell: bash
        run: rm -f android/app/keygen-upload-keystore.jks

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: key-generator-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
