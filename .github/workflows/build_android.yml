name: Build Activation Key Generator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build_android.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: key-generator-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze and Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true

      - name: Show Tool Versions
        run: |
          flutter --version
          java -version

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Build Release APK
        shell: bash
        run: |
          set +e
          flutter build apk --release --verbose
          BUILD_STATUS=$?
          set -e
          echo "Flutter command exit code: $BUILD_STATUS"
          # Flutter 3.50 may fail to recognize an APK emitted by the newer AGP,
          # even when Gradle's assembleRelease task completed successfully.
          # The following step independently verifies that a real APK exists.

      - name: Locate and Verify APK
        shell: bash
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK="$(find . -type f -path '*/outputs/*' -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Flutter build finished but no APK was found. Listing APK outputs:"
            find . -type f -name '*.apk' -print || true
            echo "Listing Android app output directories:"
            find android/app/build/outputs -maxdepth 7 -print 2>/dev/null || true
            exit 1
          fi
          if [ "$APK" != "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          fi
          test -s build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: key-generator-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
